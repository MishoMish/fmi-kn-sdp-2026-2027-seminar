name: CI

# Builds everything on all three OSes students use. Starter tests are
# expected to fail (they wait for students' solutions), so only released
# reference solutions are run.
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build --preset default
      - name: Test released solutions
        run: ctest --preset solution

  widgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the widget algorithms
        run: node --test widgets/test/core.test.mjs
