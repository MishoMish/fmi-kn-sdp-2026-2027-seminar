<text x="40.0" y="280.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Всеки възел е отделна алокация в heap-а — някъде в паметта. Знаем само как да стигнем</text>
<text x="40.0" y="302.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">от един възел до следващия: позиция i струва i стъпки. Последният сочи nullptr.</text>
