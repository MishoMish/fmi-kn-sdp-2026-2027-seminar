<text x="40.0" y="380.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">slow прави 1 стъпка, fast — 2. Ако няма цикъл, fast стига nullptr. Ако има — вътре в цикъла</text>
<text x="40.0" y="404.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">fast настига slow с по една позиция на стъпка, значи го застига за ≤ дължината на цикъла. Θ(1) памет.</text>
