<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Указател към указател: link</title>
<rect width="1000" height="300" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="700">🔬 Node** link: един код за началото и за средата</text>
<rect x="60.0" y="140.0" width="100.0" height="44.0" rx="6" fill="#f6f5f2" stroke="#8a8984" stroke-width="1.5"/>
<text x="110.0" y="168.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">head_</text>
<rect x="260.0" y="140.0" width="92.0" height="44.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="318.0" y1="140.0" x2="318.0" y2="184.0" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="round"/>
<text x="289.0" y="168.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">a</text>
<circle cx="335.0" cy="162.0" r="3.5" fill="#52514e" stroke="#52514e" stroke-width="0"/>
<line x1="335.0" y1="162.0" x2="438.0" y2="162.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="440.0" y="140.0" width="92.0" height="44.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="498.0" y1="140.0" x2="498.0" y2="184.0" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="round"/>
<text x="469.0" y="168.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">b</text>
<circle cx="515.0" cy="162.0" r="3.5" fill="#52514e" stroke="#52514e" stroke-width="0"/>
<line x1="515.0" y1="162.0" x2="618.0" y2="162.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="620.0" y="140.0" width="92.0" height="44.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="678.0" y1="140.0" x2="678.0" y2="184.0" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="round"/>
<text x="649.0" y="168.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">c</text>
<line x1="682.0" y1="178.0" x2="706.0" y2="146.0" stroke="#8a8984" stroke-width="1.5" stroke-linecap="round"/>
<line x1="160.0" y1="162.0" x2="258.0" y2="162.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="110.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">link = &amp;head_</text>
<text x="335.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">link = &amp;a-&gt;next</text>
<text x="40.0" y="240.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">*link е указателят, който води към текущия възел. Премахването е винаги *link = cur-&gt;next —</text>
<text x="40.0" y="262.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">без значение дали *link е head_ или next на предишния. Linus Torvalds нарича това „добър вкус“.</text>
</svg>
