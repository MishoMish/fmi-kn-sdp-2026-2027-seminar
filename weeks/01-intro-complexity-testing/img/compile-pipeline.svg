<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>От изходен код до изпълним файл: препроцесор, компилатор, линкер</title>
<rect width="1100" height="430" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">От изходен код до изпълним файл</text>
<text x="40.0" y="74.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Всеки .cpp файл е отделна единица на транслация (translation unit) и се компилира самостоятелно.</text>
<text x="120.0" y="116.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600">ИЗХОДЕН КОД</text>
<text x="330.0" y="116.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600">ПРЕПРОЦЕСОР</text>
<text x="550.0" y="116.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600">КОМПИЛАТОР</text>
<text x="770.0" y="116.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600">ЛИНКЕР</text>
<text x="980.0" y="116.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600">РЕЗУЛТАТ</text>
<rect x="40.0" y="140.0" width="160.0" height="64.0" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="120.0" y="166.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">main.cpp</text>
<text x="120.0" y="188.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">#include "stats.h"</text>
<line x1="200.0" y1="172.0" x2="250.0" y2="172.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="250.0" y="140.0" width="160.0" height="64.0" rx="8" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="330.0" y="166.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">g++ -E</text>
<text x="330.0" y="188.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">#include → текст</text>
<line x1="410.0" y1="172.0" x2="470.0" y2="172.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="470.0" y="140.0" width="160.0" height="64.0" rx="8" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="550.0" y="166.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">g++ -c</text>
<text x="550.0" y="188.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">→ main.o</text>
<line x1="630.0" y1="172.0" x2="690.0" y2="236.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40.0" y="270.0" width="160.0" height="64.0" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="120.0" y="296.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">stats.cpp</text>
<text x="120.0" y="318.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">#include "stats.h"</text>
<line x1="200.0" y1="302.0" x2="250.0" y2="302.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="250.0" y="270.0" width="160.0" height="64.0" rx="8" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="330.0" y="296.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">g++ -E</text>
<text x="330.0" y="318.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">#include → текст</text>
<line x1="410.0" y1="302.0" x2="470.0" y2="302.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="470.0" y="270.0" width="160.0" height="64.0" rx="8" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="550.0" y="296.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">g++ -c</text>
<text x="550.0" y="318.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">→ stats.o</text>
<line x1="630.0" y1="302.0" x2="690.0" y2="236.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="690.0" y="204.0" width="160.0" height="64.0" rx="8" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="770.0" y="230.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ld</text>
<text x="770.0" y="252.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">свързва символите</text>
<rect x="690.0" y="316.0" width="160.0" height="56.0" rx="8" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="770.0" y="338.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">libstdc++</text>
<text x="770.0" y="360.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">std::vector, cout…</text>
<line x1="770.0" y1="316.0" x2="770.0" y2="270.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="850.0" y1="236.0" x2="900.0" y2="236.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="900.0" y="204.0" width="160.0" height="64.0" rx="8" fill="#fde8df" stroke="#eb6834" stroke-width="1.5"/>
<text x="980.0" y="230.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">./app</text>
<text x="980.0" y="252.4" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">изпълним файл</text>
<text x="40.0" y="408.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Грешка от компилатора (синтаксис, типове) идва от един .cpp; „undefined reference“ идва от линкера — липсва дефиниция.</text>
</svg>
