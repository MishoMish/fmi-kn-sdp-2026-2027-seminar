<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Работен цикъл с CMake: configure, build, test</title>
<rect width="1100" height="360" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">CMake: три команди, една папка build/</text>
<rect x="40.0" y="90.0" width="330.0" height="170.0" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="60.0" y="124.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="700">1 · configure</text>
<rect x="54.0" y="140.0" width="302.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
<text x="64.0" y="166.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">cmake --preset default</text>
<text x="60.0" y="212.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400">чете CMakeLists.txt,</text>
<text x="60.0" y="236.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400">създава build/default/</text>
<line x1="370.0" y1="175.0" x2="395.0" y2="175.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="395.0" y="90.0" width="330.0" height="170.0" rx="8" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="415.0" y="124.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="700">2 · build</text>
<rect x="409.0" y="140.0" width="302.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
<text x="419.0" y="166.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">cmake --build --preset default</text>
<text x="415.0" y="212.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400">компилира и линква</text>
<text x="415.0" y="236.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400">само променените файлове</text>
<line x1="725.0" y1="175.0" x2="750.0" y2="175.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="750.0" y="90.0" width="330.0" height="170.0" rx="8" fill="#fde8df" stroke="#eb6834" stroke-width="1.5"/>
<text x="770.0" y="124.0" font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="700">3 · test</text>
<rect x="764.0" y="140.0" width="302.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
<text x="774.0" y="166.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ctest --preset default</text>
<text x="770.0" y="212.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400">пуска тестовете,</text>
<text x="770.0" y="236.0" font-size="16" fill="#52514e" text-anchor="start" font-weight="400">показва кои падат</text>
<path d="M 900,260 C 900,320 560,320 560,262" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="730.0" y="330.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400" font-style="italic">промених .cpp → само 2 и 3</text>
<text x="40.0" y="330.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400" font-style="italic">1 се пуска веднъж (или при нов файл).</text>
</svg>
