<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Цикълът червено – зелено – рефакторинг</title>
<rect width="900" height="470" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="450.0" y="44.0" font-size="24" fill="#0b0b0b" text-anchor="middle" font-weight="700">Червено → зелено → рефакторинг</text>
<path d="M 533.9,140.6 A 150,150 0 0 1 599.6,254.5" fill="none" stroke="#52514e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 515.8,399.8 A 150,150 0 0 1 384.2,399.8" fill="none" stroke="#52514e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 300.4,254.5 A 150,150 0 0 1 366.1,140.6" fill="none" stroke="#52514e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="338.0" y="73.0" width="224.0" height="84.0" rx="42" fill="#fbe3e3" stroke="#e34948" stroke-width="2"/>
<text x="450.0" y="107.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700">ЧЕРВЕНО</text>
<text x="450.0" y="128.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">тест, който пада</text>
<text x="450.0" y="145.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">(доказва, че тестът работи)</text>
<rect x="467.9" y="298.0" width="224.0" height="84.0" rx="42" fill="#dcf3ea" stroke="#1baf7a" stroke-width="2"/>
<text x="579.9" y="332.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700">ЗЕЛЕНО</text>
<text x="579.9" y="353.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">минимален код,</text>
<text x="579.9" y="370.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">за да мине</text>
<rect x="208.1" y="298.0" width="224.0" height="84.0" rx="42" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/>
<text x="320.1" y="332.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700">РЕФАКТОРИНГ</text>
<text x="320.1" y="353.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">изчисти кода —</text>
<text x="320.1" y="370.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">тестовете остават зелени</text>
</svg>
