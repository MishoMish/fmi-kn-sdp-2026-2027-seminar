<text x="40.0" y="92.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">int&amp; first = a[0];   a.pushBack(99);   first = 7;   // UB</text>
