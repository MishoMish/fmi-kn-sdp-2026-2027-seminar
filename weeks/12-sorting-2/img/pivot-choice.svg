<rect x="140.0" y="312.0" width="30.0" height="28.0" rx="5" fill="#fbe3e3" stroke="#e34948" stroke-width="1.4"/>
<text x="155.0" y="330.3" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">6</text>
<rect x="174.0" y="312.0" width="48.0" height="28.0" rx="4" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="228.0" y="331.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">+ 2 елемента</text>
<rect x="160.0" y="352.0" width="30.0" height="28.0" rx="5" fill="#fbe3e3" stroke="#e34948" stroke-width="1.4"/>
<text x="175.0" y="370.3" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">7</text>
<rect x="194.0" y="352.0" width="24.0" height="28.0" rx="4" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="224.0" y="371.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">+ 1 елемент</text>
<text x="40.0" y="410.0" font-size="15" fill="#e34948" text-anchor="start" font-weight="700">n нива × до n сравнения: Θ(n²)</text>
<text x="40.0" y="434.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">и n рекурсивни извиквания: стекът прелива</text>
<text x="600.0" y="92.0" font-size="16" fill="#1baf7a" text-anchor="start" font-weight="700">случаен pivot (или медиана от три)</text>
