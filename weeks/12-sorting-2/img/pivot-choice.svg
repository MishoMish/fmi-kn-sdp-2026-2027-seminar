<text x="600.0" y="360.0" font-size="15" fill="#1baf7a" text-anchor="start" font-weight="700">≈ log₂ n нива × Θ(n) на ниво</text>
<text x="600.0" y="384.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">очаквано ≈ 1.39 n log₂ n сравнения</text>
<text x="600.0" y="410.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(като BST от случаен ред — седмица 09)</text>
<text x="600.0" y="434.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Най-лошото остава Θ(n²), но с вероятност ≈ 0</text>
