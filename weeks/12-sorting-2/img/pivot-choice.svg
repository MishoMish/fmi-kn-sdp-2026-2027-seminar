<rect x="609.2" y="280.0" width="24.0" height="28.0" rx="4" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="621.2" y="299.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">n/8</text>
<rect x="651.8" y="280.0" width="24.0" height="28.0" rx="4" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="663.8" y="299.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">n/8</text>
<rect x="694.2" y="280.0" width="24.0" height="28.0" rx="4" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
