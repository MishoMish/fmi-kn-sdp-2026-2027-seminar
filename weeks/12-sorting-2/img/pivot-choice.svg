<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Изборът на pivot</title>
<rect width="1100" height="470" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Изборът на pivot решава дълбочината на рекурсията</text>
<text x="40.0" y="92.0" font-size="16" fill="#e34948" text-anchor="start" font-weight="700">сортиран вход, pivot = първият</text>
<rect x="40.0" y="112.0" width="30.0" height="28.0" rx="5" fill="#fbe3e3" stroke="#e34948" stroke-width="1.4"/>
<text x="55.0" y="130.3" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<rect x="74.0" y="112.0" width="168.0" height="28.0" rx="4" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="248.0" y="131.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">+ 7 елемента</text>
