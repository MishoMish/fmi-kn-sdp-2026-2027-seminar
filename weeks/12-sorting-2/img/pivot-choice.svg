<rect x="134.0" y="232.0" width="96.0" height="28.0" rx="4" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="236.0" y="251.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">+ 4 елемента</text>
<rect x="120.0" y="272.0" width="30.0" height="28.0" rx="5" fill="#fbe3e3" stroke="#e34948" stroke-width="1.4"/>
<text x="135.0" y="290.3" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5</text>
<rect x="154.0" y="272.0" width="72.0" height="28.0" rx="4" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
