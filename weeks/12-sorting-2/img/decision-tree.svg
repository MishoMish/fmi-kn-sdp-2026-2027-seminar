<text x="870.0" y="254.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">≈ n log₂ n − 1.44 n</text>
<text x="40.0" y="440.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Височина = сравнения в най-лошия случай. Ω(n log n) за всяко сортиране само със сравнения.</text>
