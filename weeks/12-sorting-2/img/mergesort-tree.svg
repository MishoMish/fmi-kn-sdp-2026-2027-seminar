<text x="860.0" y="272.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">     = Θ(n log n)</text>
<text x="860.0" y="312.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">винаги — дори при</text>
<text x="860.0" y="334.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">сортиран вход</text>
