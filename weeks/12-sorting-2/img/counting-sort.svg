<text x="500.0" y="130.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">Без нито едно сравнение.</text>
<text x="500.0" y="156.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Θ(n + k) време и памет, k = брой ключове</text>
<text x="500.0" y="210.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Стабилно: 3a, 3c, 3f остават в този ред —</text>
<text x="500.0" y="232.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">затова обхождаме входа по ред.</text>
<text x="500.0" y="286.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Само за малки цели ключове:</text>
<text x="500.0" y="308.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">оценки, възраст, байт (k = 256).</text>
<text x="500.0" y="330.0" font-size="14" fill="#e34948" text-anchor="start" font-weight="400">При k = 2^32 — 16 GB за броячите.</text>
