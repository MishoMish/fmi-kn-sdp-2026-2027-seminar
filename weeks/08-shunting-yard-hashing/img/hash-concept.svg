<text x="110.0" y="127.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">"tree"</text>
<line x1="184.0" y1="121.0" x2="280.0" y2="121.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="284.0" y="100.0" width="120.0" height="42.0" rx="6" fill="#fde8df" stroke="#eb6834" stroke-width="1.5"/>
<text x="344.0" y="127.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">hash()</text>
<line x1="408.0" y1="121.0" x2="500.0" y2="121.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="560.0" y="127.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">% 8 = 5</text>
<path d="M 616,121 C 700,121 951,160 951,276" fill="none" stroke="#2a78d6" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
