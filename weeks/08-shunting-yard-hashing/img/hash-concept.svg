<text x="1043.0" y="342.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">7</text>
<text x="40.0" y="330.0" font-size="16" fill="#e34948" text-anchor="start" font-weight="700">"tree" и "graph" → 5: КОЛИЗИЯ</text>
<text x="40.0" y="380.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Колизиите са неизбежни (повече възможни ключове, отколкото клетки). Въпросът е само как ги обработваме.</text>
