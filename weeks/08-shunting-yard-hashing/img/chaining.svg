<line x1="114.0" y1="275.0" x2="158.0" y2="275.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="310.0" y="260.0" width="120.0" height="30.0" rx="5" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="370.0" y="280.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">graph</text>
<line x1="274.0" y1="275.0" x2="308.0" y2="275.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60.0" y="296.0" width="50.0" height="30.0" rx="5" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.4"/>
<text x="85.0" y="316.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">6</text>
<rect x="60.0" y="332.0" width="50.0" height="30.0" rx="5" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.4"/>
<text x="85.0" y="352.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">7</text>
<rect x="160.0" y="332.0" width="120.0" height="30.0" rx="5" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="220.0" y="352.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">set</text>
<line x1="114.0" y1="347.0" x2="158.0" y2="347.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="640.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">insert: в началото/края на веригата</text>
<text x="640.0" y="146.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">find: обхождаме само една верига</text>
<text x="640.0" y="196.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">load factor α = n / m</text>
<text x="640.0" y="222.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">средна дължина на верига = α</text>
<text x="640.0" y="248.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">α ≤ 1 → Θ(1) средно</text>
<text x="640.0" y="274.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">при α &gt; 1 → rehash с 2m клетки</text>
</svg>
