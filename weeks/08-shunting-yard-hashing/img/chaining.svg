<line x1="114.0" y1="203.0" x2="158.0" y2="203.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="310.0" y="188.0" width="120.0" height="30.0" rx="5" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="370.0" y="208.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">queue</text>
<line x1="274.0" y1="203.0" x2="308.0" y2="203.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="460.0" y="188.0" width="120.0" height="30.0" rx="5" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="520.0" y="208.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">stack</text>
<line x1="424.0" y1="203.0" x2="458.0" y2="203.0" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60.0" y="224.0" width="50.0" height="30.0" rx="5" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.4"/>
<text x="85.0" y="244.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4</text>
<rect x="60.0" y="260.0" width="50.0" height="30.0" rx="5" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.4"/>
