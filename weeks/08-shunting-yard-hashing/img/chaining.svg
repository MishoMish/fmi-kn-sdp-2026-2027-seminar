<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="700">Отделни вериги (separate chaining): всяка клетка е списък</text>
<rect x="60.0" y="80.0" width="50.0" height="30.0" rx="5" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.4"/>
