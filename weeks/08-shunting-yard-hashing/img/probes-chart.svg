<text x="690.0" y="280.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">пробване прави 1.5 / 2.5 проби;</text>
<text x="690.0" y="300.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">при α = 0.9 — 5.5 / 50.5.</text>
<text x="690.0" y="336.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Затова отвореното адресиране</text>
<text x="690.0" y="356.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">се преоразмерява много по-рано.</text>
</svg>
