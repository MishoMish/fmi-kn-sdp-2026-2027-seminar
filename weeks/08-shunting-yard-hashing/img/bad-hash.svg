<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Добра и лоша хеш функция върху 10 000 ключа key0…key9999</title>
<rect width="1100" height="500" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="44.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">10 000 ключа „key0“ … „key9999“ в 16 384 клетки</text>
<text x="40.0" y="70.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Колко клетки имат верига с дадена дължина (FNV-1a) — и какво прави сумата на символите</text>
