<text x="310.0" y="408.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<rect x="346.0" y="389.6" width="48.0" height="0.4" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
