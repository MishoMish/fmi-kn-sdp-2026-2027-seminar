<text x="370.0" y="408.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4</text>
<rect x="406.0" y="389.9" width="48.0" height="0.1" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
