<text x="340.0" y="432.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400">дължина на веригата (FNV-1a)</text>
<text x="100.0" y="100.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">FNV-1a: заети 7876 клетки, най-дълга верига 5</text>
<rect x="650.0" y="120.0" width="410.0" height="240.0" rx="12" fill="#fbe3e3" stroke="#e34948" stroke-width="1.5"/>
<text x="670.0" y="156.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">сума на символите</text>
<text x="670.0" y="196.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">заети клетки: 91 от 16384</text>
<text x="670.0" y="226.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">най-дълга верига: 615</text>
<text x="670.0" y="266.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">„key123“, „key132“, „key213“, …</text>
<text x="670.0" y="288.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">имат еднаква сума → един и същ индекс.</text>
<text x="670.0" y="326.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">Търсене: до 615 сравнения вместо ~1.</text>
<text x="40.0" y="484.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Хеш таблицата е бърза само толкова, колкото е равномерна хеш функцията.</text>
