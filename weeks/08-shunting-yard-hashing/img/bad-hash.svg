<text x="130.0" y="408.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0</text>
<rect x="166.0" y="221.0" width="48.0" height="169.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
