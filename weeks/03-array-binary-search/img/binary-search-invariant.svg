<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Инвариантът на двоичното търсене</title>
<rect width="1100" height="260" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Инвариантът: три области, само средната е неизвестна</text>
<rect x="40.0" y="90.0" width="354.0" height="70.0" rx="8" fill="#fbe3e3" stroke="#e34948" stroke-width="2"/>
<text x="217.0" y="122.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">[first, lo)</text>
<text x="217.0" y="146.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400">всичко тук е &lt; value</text>
<rect x="400.0" y="90.0" width="294.0" height="70.0" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
<text x="547.0" y="122.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">[lo, hi)</text>
<text x="547.0" y="146.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400">непроверени</text>
<rect x="700.0" y="90.0" width="354.0" height="70.0" rx="8" fill="#dcf3ea" stroke="#1baf7a" stroke-width="2"/>
<text x="877.0" y="122.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">[hi, last)</text>
<text x="877.0" y="146.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400">всичко тук е ≥ value</text>
<text x="397.0" y="82.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">lo</text>
<text x="697.0" y="82.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">hi</text>
<text x="40.0" y="204.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Всяка стъпка гледа mid в средата на [lo, hi) и премества lo или hi — средната област намалява</text>
<text x="40.0" y="228.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">поне наполовина. Когато е празна (lo == hi), lo е отговорът. Нищо не се „търси“ — само се стеснява.</text>
</svg>
