<text x="40.0" y="254.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">⌊√20⌋ = firstTrue − 1 = 4. Няма масив — „масивът“ е предикатът, който пресмятаме при нужда.</text>
<text x="40.0" y="278.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Работи за всеки монотонен въпрос: минимален капацитет, най-малко време, първа лоша версия…</text>
