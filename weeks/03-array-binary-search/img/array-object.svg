<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Обектът FixedArray и буферът, който притежава</title>
<rect width="1000" height="330" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">FixedArray&lt;int&gt;: малък обект + буфер в heap-а</text>
<text x="40.0" y="100.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">обектът (напр. в стека)</text>
<rect x="40.0" y="112.0" width="230.0" height="40.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="56.0" y="138.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">data_</text>
<text x="254.0" y="138.0" font-size="15" fill="#52514e" text-anchor="end" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0x7f3a…</text>
<rect x="40.0" y="156.0" width="230.0" height="40.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="56.0" y="182.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">size_</text>
<text x="254.0" y="182.0" font-size="15" fill="#52514e" text-anchor="end" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<rect x="40.0" y="200.0" width="230.0" height="40.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="56.0" y="226.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">capacity_</text>
<text x="254.0" y="226.0" font-size="15" fill="#52514e" text-anchor="end" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">6</text>
<text x="420.0" y="100.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">буферът в heap-а (capacity_ = 6 елемента)</text>
<rect x="420.0" y="112.0" width="82.0" height="48.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="461.0" y="142.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4</text>
<text x="461.0" y="178.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0</text>
<rect x="506.0" y="112.0" width="82.0" height="48.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="547.0" y="142.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">8</text>
<text x="547.0" y="178.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<rect x="592.0" y="112.0" width="82.0" height="48.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="633.0" y="142.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">15</text>
<text x="633.0" y="178.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<rect x="678.0" y="112.0" width="82.0" height="48.0" rx="6" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="719.0" y="178.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<rect x="764.0" y="112.0" width="82.0" height="48.0" rx="6" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="805.0" y="178.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4</text>
<rect x="850.0" y="112.0" width="82.0" height="48.0" rx="6" fill="#f6f5f2" stroke="#e4e3df" stroke-width="1.5"/>
<text x="891.0" y="178.0" font-size="12" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5</text>
<path d="M 270,132 C 330,132 360,136 418,136" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 420,196 L 420,206 L 674,206 L 674,196" fill="none" stroke="#8a8984" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="547.0" y="228.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">използвани: size_ = 3</text>
<path d="M 420,240 L 420,250 L 932,250 L 932,240" fill="none" stroke="#8a8984" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="676.0" y="272.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">заделени: capacity_ = 6</text>
<text x="40.0" y="314.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Инвариант: 0 ≤ size_ ≤ capacity_. Обектът притежава буфера: деструкторът го освобождава.</text>
</svg>
