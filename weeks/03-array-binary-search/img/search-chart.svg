<circle cx="730.0" cy="248.4" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="740.0" y="253.4" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">двоично</text>
<line x1="850.0" y1="130.0" x2="872.0" y2="130.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
<text x="880.0" y="135.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">линейно, Θ(n)</text>
<line x1="850.0" y1="154.0" x2="872.0" y2="154.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="880.0" y="159.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">двоично, Θ(log n)</text>
<text x="850.0" y="210.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">n = 2²⁴ ≈ 16.8 млн:</text>
<text x="850.0" y="232.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">двоично — 159 ns</text>
<text x="850.0" y="254.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(24 стъпки)</text>
<text x="850.0" y="290.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">При големи n всяка стъпка</text>
<text x="850.0" y="310.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">е промах в кеша — затова</text>
<text x="850.0" y="330.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">кривата се огъва нагоре.</text>
<text x="40.0" y="500.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">std::binary_search дава почти същите числа като вашето lowerBound — същият алгоритъм.</text>
