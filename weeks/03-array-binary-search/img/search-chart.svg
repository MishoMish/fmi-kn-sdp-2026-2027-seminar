<circle cx="420.0" cy="150.3" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="430.0" y="155.3" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">линейно</text>
<path d="M110.0,335.2 L172.0,324.8 L234.0,316.6 L296.0,308.1 L358.0,300.9 L420.0,291.0 L482.0,282.4 L544.0,274.7 L606.0,260.9 L668.0,253.2 L730.0,248.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="110.0" cy="335.2" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="172.0" cy="324.8" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="234.0" cy="316.6" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="296.0" cy="308.1" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="358.0" cy="300.9" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="420.0" cy="291.0" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="482.0" cy="282.4" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
