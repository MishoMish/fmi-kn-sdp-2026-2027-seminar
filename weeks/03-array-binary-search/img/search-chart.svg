<text x="100.0" y="105.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">10000</text>
<line x1="110.0" y1="430.0" x2="110.0" y2="436.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="110.0" y="454.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^4</text>
<line x1="234.0" y1="430.0" x2="234.0" y2="436.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="234.0" y="454.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^8</text>
<line x1="358.0" y1="430.0" x2="358.0" y2="436.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="358.0" y="454.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^12</text>
<line x1="482.0" y1="430.0" x2="482.0" y2="436.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="482.0" y="454.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^16</text>
<line x1="606.0" y1="430.0" x2="606.0" y2="436.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="606.0" y="454.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^20</text>
<line x1="730.0" y1="430.0" x2="730.0" y2="436.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="730.0" y="454.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^24</text>
<line x1="110.0" y1="430.0" x2="730.0" y2="430.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="420.0" y="482.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400">n (лог. ос)</text>
<text transform="translate(52,265.0) rotate(-90)" font-size="15" fill="#52514e" text-anchor="middle">ns на търсене (лог. ос)</text>
<path d="M110.0,366.4 L172.0,337.5 L234.0,290.1 L296.0,248.0 L358.0,199.7 L420.0,150.3" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="110.0" cy="366.4" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="172.0" cy="337.5" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
