<text x="100.0" y="352.5" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">10</text>
<line x1="110.0" y1="265.0" x2="730.0" y2="265.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="100.0" y="270.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">100</text>
<line x1="110.0" y1="182.5" x2="730.0" y2="182.5" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="100.0" y="187.5" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">1000</text>
