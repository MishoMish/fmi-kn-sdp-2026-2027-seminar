<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Брой единици: четири начина</title>
<rect width="1100" height="420" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="44.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Брой единици в 64-битово число (ns на число)</text>
<text x="40.0" y="70.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">10 000 000 случайни числа; release; с и без -march=native</text>
<text x="248.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="400">64 проверки</text>
<rect x="260.0" y="100.0" width="443.5" height="20.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="711.5" y="115.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">18.48</text>
<rect x="260.0" y="124.0" width="504.8" height="20.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="772.8" y="139.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">21.03</text>
<text x="248.0" y="186.0" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="400">x &amp;= x − 1</text>
<rect x="260.0" y="166.0" width="400.9" height="20.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="668.9" y="181.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">16.71</text>
<rect x="260.0" y="190.0" width="2.7" height="20.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="270.7" y="205.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0.11</text>
<text x="248.0" y="252.0" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="400">таблица по байт</text>
<rect x="260.0" y="232.0" width="36.3" height="20.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="304.3" y="247.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1.51</text>
<rect x="260.0" y="256.0" width="76.5" height="20.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="344.5" y="271.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3.19</text>
<text x="248.0" y="318.0" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="400">std::bitset::count</text>
<rect x="260.0" y="298.0" width="52.6" height="20.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="320.6" y="313.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2.19</text>
<rect x="260.0" y="322.0" width="2.0" height="20.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="270.0" y="337.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0.07</text>
<line x1="300.0" y1="380.0" x2="322.0" y2="380.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="330.0" y="385.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">по подразбиране (x86-64 без POPCNT)</text>
<line x1="640.0" y1="380.0" x2="662.0" y2="380.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
<text x="670.0" y="385.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">-march=native</text>
<text x="880.0" y="140.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">С -march=native GCC</text>
<text x="880.0" y="160.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">разпознава цикъла на</text>
<text x="880.0" y="180.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Kernighan и го заменя</text>
<text x="880.0" y="200.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">с една инструкция</text>
<text x="880.0" y="220.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">popcnt (проверено</text>
<text x="880.0" y="240.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">в асемблера).</text>
</svg>
