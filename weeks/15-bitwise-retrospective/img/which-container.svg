<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Коя структура?</title>
<rect width="1100" height="520" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Коя структура? Въпросите, които решават</text>
<rect x="40.0" y="80.0" width="300.0" height="40.0" rx="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="190.0" y="105.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">търсене по ключ?</text>
<rect x="40.0" y="200.0" width="300.0" height="40.0" rx="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="190.0" y="225.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">трябва ли наредба / интервал?</text>
<rect x="40.0" y="320.0" width="210.0" height="52.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="145.0" y="342.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::unordered_map</text>
<text x="145.0" y="362.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">Θ(1) средно — седм. 08</text>
<rect x="270.0" y="320.0" width="210.0" height="52.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="375.0" y="342.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::map / set</text>
<text x="375.0" y="362.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">Θ(log n) — седм. 10</text>
<line x1="190.0" y1="120.0" x2="190.0" y2="198.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="196.0" y="155.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">да</text>
<line x1="150.0" y1="240.0" x2="145.0" y2="318.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="153.5" y="275.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">не</text>
<line x1="250.0" y1="240.0" x2="370.0" y2="318.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="316.0" y="275.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">да</text>
<rect x="460.0" y="80.0" width="320.0" height="40.0" rx="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="620.0" y="105.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">само най-малкият / най-големият?</text>
<rect x="500.0" y="200.0" width="240.0" height="52.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="620.0" y="222.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::priority_queue</text>
<text x="620.0" y="242.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">Θ(log n) — седм. 11</text>
<line x1="620.0" y1="120.0" x2="620.0" y2="198.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="626.0" y="155.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">да</text>
<line x1="340.0" y1="100.0" x2="458.0" y2="100.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="405.0" y="96.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">не</text>
<rect x="820.0" y="80.0" width="240.0" height="40.0" rx="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="940.0" y="105.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">само от краищата?</text>
<rect x="820.0" y="200.0" width="240.0" height="52.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="940.0" y="222.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::deque / stack / queue</text>
<text x="940.0" y="242.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">Θ(1) — седм. 07</text>
<line x1="940.0" y1="120.0" x2="940.0" y2="198.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="946.0" y="155.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">да</text>
<line x1="780.0" y1="100.0" x2="818.0" y2="100.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="805.0" y="96.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">не</text>
<rect x="820.0" y="300.0" width="240.0" height="40.0" rx="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="940.0" y="325.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">иначе (индекс, обхождане)</text>
<rect x="820.0" y="400.0" width="240.0" height="52.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="940.0" y="422.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::vector</text>
<text x="940.0" y="442.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">почти винаги — седм. 04</text>
<path d="M 1060,100 C 1090,100 1090,320 1062,320" fill="none" stroke="#52514e" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="940.0" y1="340.0" x2="940.0" y2="398.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="946.0" y="365.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400"></text>
<text x="40.0" y="430.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Свързан списък (седм. 05–06) — рядко: когато трябват стабилни итератори при вмъкване в средата,</text>
<text x="40.0" y="450.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">или splice за Θ(1). Иначе векторът печели заради локалността (седм. 02).</text>
<text x="40.0" y="486.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Граф: списъци на съседство (седм. 13). Най-къс път: BFS без тегла, Дейкстра с тегла ≥ 0 (седм. 14).</text>
</svg>
