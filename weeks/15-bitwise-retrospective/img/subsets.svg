<text x="500.0" y="110.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">бит i вдигнат ⇔ v[i] е в подмножеството</text>
<text x="500.0" y="140.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">for (u32 mask = 0; mask &lt; (1u &lt;&lt; n); ++mask)</text>
<text x="534.0" y="162.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">for (i = 0; i &lt; n; ++i)</text>
<text x="568.0" y="184.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">if (mask &amp; (1u &lt;&lt; i)) …</text>
<text x="500.0" y="230.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">2^n подмножества: при n = 20 — около милион,</text>
<text x="500.0" y="252.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">при n = 40 — трилион. Пълно изброяване</text>
<text x="500.0" y="274.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">става само за малки n.</text>
<text x="500.0" y="318.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Обединение: m1 | m2; сечение: m1 &amp; m2;</text>
<text x="500.0" y="340.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">разлика: m1 &amp; ~m2; размер: popcount(m).</text>
