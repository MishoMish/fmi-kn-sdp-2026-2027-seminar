<text x="450.0" y="100.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">за всеки ред — три маски от n бита:</text>
<text x="450.0" y="128.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">cols — заети колони</text>
<text x="450.0" y="150.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">d1   — „/“ диагонали (местят се наляво с &lt;&lt;)</text>
<text x="450.0" y="172.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">d2   — „\“ диагонали (местят се надясно с &gt;&gt;)</text>
<text x="450.0" y="214.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">free = ~(cols | d1 | d2) &amp; ((1 &lt;&lt; n) − 1);</text>
<text x="450.0" y="236.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">while (free) {</text>
<text x="484.0" y="258.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">bit = free &amp; −free;  free ^= bit;</text>
<text x="484.0" y="280.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">place(cols | bit, (d1 | bit) &lt;&lt; 1, (d2 | bit) &gt;&gt; 1);</text>
<text x="450.0" y="302.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">}</text>
<text x="450.0" y="346.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Никакви масиви, никакви проверки на диагонали —</text>
<text x="450.0" y="368.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">всяка стъпка е няколко инструкции.</text>
<text x="450.0" y="404.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">n = 8: 92 решения; n = 14: 365 596 за ~0.1 s.</text>
</svg>
