<text x="580.0" y="254.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">word_ = &amp;words_[70 / 64]</text>
<text x="580.0" y="276.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">mask_ = 1 &lt;&lt; (70 % 64)</text>
<path d="M 600,200 C 600,170 610,150 752,142" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="40.0" y="230.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">operator bool()   → (*word_ &amp; mask_) != 0</text>
<text x="40.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">operator=(bool)   → *word_ |= mask_  /  &amp;= ~mask_</text>
<text x="40.0" y="282.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">operator=(BitRef) → копира СТОЙНОСТТА на бита</text>
<text x="40.0" y="336.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Бит няма адрес → няма bool&amp;. Проксито „се държи като референция“ — точно както std::vector&lt;bool&gt;.</text>
