<text x="770.0" y="290.0" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">back</text>
<text x="40.0" y="330.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Пълен краен блок → нов блок (една алокация за B елемента). Пълен map → нов map: копират се само указателите.</text>
<text x="40.0" y="356.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Елементите никога не се местят → push в краищата пази референциите (но не и итераторите).</text>
<text x="40.0" y="382.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">d[i]: блок (start + i) / B, позиция (start + i) % B — Θ(1). В libstdc++ блокът е 512 байта.</text>
</svg>
