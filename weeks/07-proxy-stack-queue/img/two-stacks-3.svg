<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Опашка с два стека, стъпка 3</title>
<rect width="1000" height="330" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="44.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="700">Опашка от два стека</text>
<text x="240.0" y="86.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">in (push тук)</text>
<path d="M 180,100 L 180,280 L 300,280 L 300,100" fill="none" stroke="#8a8984" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="186.0" y="236.0" width="108.0" height="40.0" rx="6" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.5"/>
<text x="240.0" y="262.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4</text>
<text x="680.0" y="86.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">out (front / pop оттук)</text>
<path d="M 620,100 L 620,280 L 740,280 L 740,100" fill="none" stroke="#8a8984" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="626.0" y="236.0" width="108.0" height="40.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="680.0" y="262.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<rect x="626.0" y="190.0" width="108.0" height="40.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="680.0" y="216.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<text x="40.0" y="312.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">pop() → от out (1 излиза пръв); push 4 → в in</text>
</svg>
