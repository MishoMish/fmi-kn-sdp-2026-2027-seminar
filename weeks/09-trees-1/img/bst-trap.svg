<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Проверка дали дърво е BST: капанът</title>
<rect width="1000" height="400" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">isBST: сравнението само с децата не стига</text>
<line x1="195.9" y1="234.1" x2="124.1" y2="305.9" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="224.1" y1="234.1" x2="295.9" y2="305.9" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="392.1" y1="128.9" x2="227.9" y2="211.1" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="424.1" y1="134.1" x2="495.9" y2="205.9" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="110.0" cy="320.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="110.0" y="325.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<circle cx="210.0" cy="220.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="210.0" y="225.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<circle cx="310.0" cy="320.0" r="20" fill="#fbe3e3" stroke="#e34948" stroke-width="1.6"/>
<text x="310.0" y="325.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">6</text>
<circle cx="410.0" cy="120.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="410.0" y="125.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5</text>
<circle cx="510.0" cy="220.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="510.0" y="225.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">8</text>
<text x="410.0" y="164.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">(−∞, +∞)</text>
<text x="210.0" y="264.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">(−∞, 5)</text>
<text x="510.0" y="264.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">(5, +∞)</text>
<text x="110.0" y="364.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">(−∞, 3)</text>
<text x="310.0" y="364.0" font-size="14" fill="#e34948" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">(3, 5) ✗</text>
<text x="560.0" y="120.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">Локално: всеки възел спрямо децата си</text>
<text x="560.0" y="146.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">при 5: 3 &lt; 5 &lt; 8 ✓</text>
<text x="560.0" y="168.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">при 3: 1 &lt; 3 &lt; 6 ✓</text>
<text x="560.0" y="194.0" font-size="14" fill="#e34948" text-anchor="start" font-weight="600">→ „валидно“ — но не е!</text>
<text x="560.0" y="236.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400">6 е в ЛЯВОТО поддърво на 5,</text>
<text x="560.0" y="260.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400">значи трябва да е &lt; 5.</text>
<text x="560.0" y="296.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">Правилно: пренасяйте интервала</text>
<text x="560.0" y="320.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(lo, hi) надолу. Наляво: hi = възела;</text>
<text x="560.0" y="342.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">надясно: lo = възела.</text>
</svg>
