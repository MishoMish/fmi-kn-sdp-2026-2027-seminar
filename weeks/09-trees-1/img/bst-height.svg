<line x1="700.0" y1="130.0" x2="722.0" y2="130.0" stroke="#e34948" stroke-width="3" stroke-linecap="round"/>
<text x="730.0" y="135.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">височина, случаен ред</text>
<line x1="700.0" y1="154.0" x2="722.0" y2="154.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="730.0" y="159.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">средна дълбочина, случаен ред</text>
<line x1="700.0" y1="178.0" x2="722.0" y2="178.0" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/>
<text x="730.0" y="183.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">log₂ n — най-ниското възможно</text>
<text x="700.0" y="236.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">При n = 2^18 ≈ 262 000:</text>
<text x="700.0" y="258.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">височина ≈ 44, средна дълбочина ≈ 22</text>
<text x="700.0" y="280.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(log₂ n = 18)</text>
<text x="700.0" y="316.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Теория: средна дълбочина ≈ 2 ln n ≈ 1.39 log₂ n,</text>
<text x="700.0" y="338.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">височина → 4.31 ln n асимптотично (Devroye, 1986)</text>
<text x="700.0" y="382.0" font-size="14" fill="#e34948" text-anchor="start" font-weight="700">Сортиран вход: височина n − 1</text>
<text x="700.0" y="404.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(262 143 — далеч извън графиката)</text>
</svg>
