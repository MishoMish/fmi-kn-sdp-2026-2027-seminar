<text x="90.0" y="233.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">30</text>
<line x1="100.0" y1="164.0" x2="660.0" y2="164.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="90.0" y="169.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">40</text>
<line x1="100.0" y1="100.0" x2="660.0" y2="100.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="90.0" y="105.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">50</text>
<line x1="100.0" y1="420.0" x2="100.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="100.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^4</text>
<line x1="180.0" y1="420.0" x2="180.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="180.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^6</text>
<line x1="260.0" y1="420.0" x2="260.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="260.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^8</text>
<line x1="340.0" y1="420.0" x2="340.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="340.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^10</text>
<line x1="420.0" y1="420.0" x2="420.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="420.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^12</text>
<line x1="500.0" y1="420.0" x2="500.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="500.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^14</text>
<line x1="580.0" y1="420.0" x2="580.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="580.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^16</text>
<line x1="660.0" y1="420.0" x2="660.0" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="660.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">2^18</text>
<line x1="100.0" y1="420.0" x2="660.0" y2="420.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="380.0" y="472.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400">n (лог. ос)</text>
<text transform="translate(42,260.0) rotate(-90)" font-size="15" fill="#52514e" text-anchor="middle">нива</text>
