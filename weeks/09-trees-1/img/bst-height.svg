<text x="90.0" y="361.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">10</text>
<line x1="100.0" y1="292.0" x2="660.0" y2="292.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="90.0" y="297.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">20</text>
