<circle cx="408.2" cy="110.0" r="20" fill="#fde8df" stroke="#eb6834" stroke-width="1.6"/>
<text x="408.2" y="115.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">A</text>
<text x="60.0" y="115.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="400">дълбочина 0</text>
<text x="60.0" y="205.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="400">дълбочина 1</text>
<text x="60.0" y="295.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="400">дълбочина 2</text>
<text x="60.0" y="385.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="400">дълбочина 3</text>
<text x="438.2" y="92.0" font-size="14" fill="#eb6834" text-anchor="start" font-weight="600">корен (root)</text>
<text x="282.0" y="424.0" font-size="14" fill="#1baf7a" text-anchor="start" font-weight="600">листа (leaves) — зелени</text>
<text x="780.0" y="112.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">родител на F:</text>
<text x="900.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">B</text>
<text x="780.0" y="152.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">деца на B:</text>
<text x="900.0" y="152.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">E, F (братя — siblings)</text>
<text x="780.0" y="192.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">предци на K:</text>
<text x="900.0" y="192.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">F, B, A</text>
<text x="780.0" y="232.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">степен на D:</text>
<text x="900.0" y="232.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">3 деца</text>
<text x="780.0" y="272.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">път A → K:</text>
<text x="900.0" y="272.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">3 ребра = дълбочина на K</text>
<text x="780.0" y="312.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">височина:</text>
<text x="900.0" y="312.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">3 = най-голямата дълбочина</text>
<text x="780.0" y="352.0" font-size="14" fill="#8a8984" text-anchor="start" font-weight="600">n възела:</text>
<text x="900.0" y="352.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">n − 1 ребра (тук 12 и 11)</text>
