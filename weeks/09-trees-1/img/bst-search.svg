<circle cx="442.0" cy="278.0" r="20" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.6"/>
<text x="442.0" y="283.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">60</text>
<circle cx="504.0" cy="194.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="504.0" y="199.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">70</text>
<circle cx="566.0" cy="278.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="566.0" y="283.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">80</text>
<circle cx="628.0" cy="362.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="628.0" y="367.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">90</text>
<line x1="454.0" y1="294.0" x2="470.0" y2="324.0" stroke="#e87ba4" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="472.0" y="342.0" font-size="13" fill="#e87ba4" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">nullptr</text>
<text x="720.0" y="110.0" font-size="17" fill="#eb6834" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">find(45)</text>
<text x="720.0" y="138.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">45 &lt; 50 → наляво</text>
<text x="720.0" y="162.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">45 &gt; 30 → надясно</text>
<text x="720.0" y="186.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">45 &gt; 40 → надясно</text>
<text x="720.0" y="210.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">45 = 45 → намерен</text>
<text x="720.0" y="262.0" font-size="17" fill="#e87ba4" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">find(55)</text>
<text x="720.0" y="290.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">55 &gt; 50 → надясно</text>
<text x="720.0" y="314.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">55 &lt; 70 → наляво</text>
<text x="720.0" y="338.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">55 &lt; 60 → наляво: nullptr</text>
<text x="720.0" y="380.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">по пътя: floor(55) = 50,</text>
<text x="720.0" y="402.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">ceiling(55) = 60</text>
<text x="720.0" y="428.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Θ(h) сравнения: h = височината</text>
</svg>
