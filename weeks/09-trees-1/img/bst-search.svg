<text x="132.0" y="199.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">30</text>
<circle cx="194.0" cy="362.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="194.0" y="367.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">35</text>
<circle cx="256.0" cy="278.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="256.0" y="283.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">40</text>
<circle cx="318.0" cy="362.0" r="20" fill="#fde8df" stroke="#eb6834" stroke-width="1.6"/>
<text x="318.0" y="367.8" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">45</text>
<circle cx="380.0" cy="110.0" r="20" fill="#fde8df" stroke="#eb6834" stroke-width="1.6"/>
