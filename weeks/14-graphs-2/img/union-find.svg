<text x="340.0" y="225.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">7</text>
<line x1="340.0" y1="202.0" x2="340.0" y2="162.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 322,132 C 260,90 200,100 170,124" fill="none" stroke="#eb6834" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="40.0" y="360.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">размер 4 срещу 2: коренът 6 сочи 1.</text>
<text x="40.0" y="380.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Височината расте само когато се слеят</text>
<text x="40.0" y="400.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">две еднакво големи → ≤ log₂ n.</text>
<text x="470.0" y="92.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">② find(5) със свиване на пътя</text>
