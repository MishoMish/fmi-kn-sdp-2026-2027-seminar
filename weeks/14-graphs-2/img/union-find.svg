<text x="900.0" y="265.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5</text>
<line x1="890.0" y1="245.0" x2="832.2" y2="158.3" stroke="#1baf7a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="820.0" y="400.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="400">след: всички сочат корена</text>
<text x="470.0" y="440.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="600">И двете заедно: m операции за O(m · α(n)); α(n) ≤ 4 за всяко n във Вселената.</text>
