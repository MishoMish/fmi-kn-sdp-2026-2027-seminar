<text x="150.0" y="485.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">пирамида (вашият dijkstra)</text>
<line x1="440.0" y1="480.0" x2="462.0" y2="480.0" stroke="#e34948" stroke-width="3" stroke-linecap="round"/>
<text x="470.0" y="485.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">масив (Дейкстра, 1959)</text>
<text x="40.0" y="520.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Разреден, n = 10^5: 21 ms срещу 16.5 s. Пълен: пирамидата пак печели — при случайни тегла малко ребра подобряват разстояние,</text>
<text x="40.0" y="540.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">затова в пирамидата влизат много по-малко от m двойки. Учебникарското „масивът е по-добър за гъсти графи“ е за най-лошия случай.</text>
