<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Дейкстра: пирамида срещу масив</title>
<rect width="1100" height="560" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="44.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Дейкстра: пирамида Θ((n + m) log n) срещу масив Θ(n²)</text>
<text x="40.0" y="70.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Release, примерна машина; ms за едно пускане</text>
<text x="310.0" y="100.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">разреден граф, m = 4n</text>
