<text x="760.0" y="120.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Разделете върховете на две групи.</text>
<text x="760.0" y="146.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">От ребрата между групите — най-лекото</text>
<text x="760.0" y="168.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(тук 1–3, тегло 4) е безопасно.</text>
<text x="760.0" y="210.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Kruskal: срезът е „компонентата на u“</text>
<text x="760.0" y="232.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">срещу „всичко друго“.</text>
<text x="760.0" y="266.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Prim: срезът е „дървото досега“</text>
<text x="760.0" y="288.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">срещу „останалите“.</text>
