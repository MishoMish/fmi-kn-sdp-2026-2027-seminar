<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Отрицателно ребро чупи Дейкстра</title>
<rect width="1100" height="330" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Отрицателни тегла: Дейкстра бърза да обяви връх за готов</text>
<line x1="138.4" y1="192.1" x2="307.9" y2="119.5" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="225.0" cy="155.0" r="11" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="225.0" y="160.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<line x1="138.7" y1="207.1" x2="307.6" y2="271.5" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="225.0" cy="240.0" r="11" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="225.0" y="245.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5</text>
<line x1="330.0" y1="260.0" x2="330.0" y2="134.0" stroke="#e34948" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="330.0" cy="195.0" r="11" fill="#ffffff" stroke="#e4e3df" stroke-width="1"/>
<text x="330.0" y="200.0" font-size="13" fill="#e34948" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">-4</text>
<circle cx="120.0" cy="200.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="120.0" y="205.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">s</text>
<circle cx="330.0" cy="110.0" r="20" fill="#fbe3e3" stroke="#e34948" stroke-width="1.8"/>
<text x="330.0" y="115.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">a</text>
<circle cx="330.0" cy="280.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="330.0" y="285.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">b</text>
<text x="480.0" y="110.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">Дейкстра: вади a с dist = 2 и го обявява за готов.</text>
<text x="480.0" y="136.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">После вади b (5) — но s → b → a = 5 − 4 = 1 &lt; 2. Твърде късно.</text>
<text x="480.0" y="162.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400"></text>
<text x="480.0" y="188.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Доказателството ползва: всяко продължение на пътя само го удължава.</text>
<text x="480.0" y="214.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">С отрицателни ребра това не е вярно.</text>
<text x="480.0" y="240.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400"></text>
<text x="480.0" y="266.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">За напреднали — Bellman–Ford: n − 1 прохода по всички ребра, Θ(n · m); открива и</text>
<text x="480.0" y="292.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">отрицателни цикли (тогава „най-къс път“ няма).</text>
</svg>
