<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Откриване на цикъл с три цвята</title>
<rect width="1100" height="400" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Цикъл в насочен граф: ребро към СИВ връх</text>
<line x1="130.0" y1="150.0" x2="236.0" y2="150.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="280.0" y1="150.0" x2="386.0" y2="150.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="395.4" y1="163.6" x2="277.5" y2="273.6" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="260.0" y1="270.0" x2="260.0" y2="174.0" stroke="#e34948" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="110.0" cy="150.0" r="20" fill="#f6f5f2" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="110.0" y="155.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0</text>
<circle cx="260.0" cy="150.0" r="20" fill="#f6f5f2" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="260.0" y="155.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<circle cx="410.0" cy="150.0" r="20" fill="#f6f5f2" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="410.0" y="155.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<circle cx="260.0" cy="290.0" r="20" fill="#f6f5f2" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="260.0" y="295.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<circle cx="110.0" cy="150.0" r="20" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="110.0" y="155.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0</text>
<circle cx="260.0" cy="150.0" r="20" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="260.0" y="155.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<circle cx="410.0" cy="150.0" r="20" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="410.0" y="155.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<circle cx="260.0" cy="290.0" r="20" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="260.0" y="295.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<text x="300.0" y="300.0" font-size="14" fill="#e34948" text-anchor="start" font-weight="600">3 → 1: 1 е СИВ → цикъл 1 → 2 → 3 → 1</text>
<text x="40.0" y="360.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Пътят на DFS 0 → 1 → 2 → 3 — всички сиви (на стека).</text>
<line x1="659.0" y1="143.7" x2="767.2" y2="107.6" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="658.1" y1="158.5" x2="768.3" y2="209.9" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="808.6" y1="107.4" x2="917.7" y2="151.1" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="808.6" y1="212.6" x2="917.7" y2="168.9" stroke="#1baf7a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="640.0" cy="150.0" r="20" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="640.0" y="155.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0</text>
<circle cx="790.0" cy="100.0" r="20" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="790.0" y="105.4" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<circle cx="790.0" cy="220.0" r="20" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="790.0" y="225.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<circle cx="940.0" cy="160.0" r="20" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="940.0" y="165.4" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<text x="640.0" y="290.0" font-size="14" fill="#1baf7a" text-anchor="start" font-weight="600">2 → 3: 3 е ЧЕРЕН (завършен) → НЕ е цикъл,</text>
<text x="640.0" y="312.0" font-size="14" fill="#1baf7a" text-anchor="start" font-weight="600">просто два пътя до 3.</text>
<rect x="640.0" y="345.0" width="16.0" height="16.0" rx="3" fill="#f6f5f2" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="662.0" y="358.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">бял — непосетен</text>
<rect x="790.0" y="345.0" width="16.0" height="16.0" rx="3" fill="#d8d8d8" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="812.0" y="358.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">сив — на стека</text>
<rect x="930.0" y="345.0" width="16.0" height="16.0" rx="3" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="952.0" y="358.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">черен — завършен</text>
</svg>
