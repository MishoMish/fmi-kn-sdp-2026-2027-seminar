<circle cx="580.0" cy="270.0" r="26" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="580.0" y="274.7" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ДАА</text>
<circle cx="420.0" cy="110.0" r="26" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="420.0" y="114.7" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">БД</text>
<text x="40.0" y="322.0" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">УП — увод в програмирането, ДС — дискретни структури, ДАА — дизайн и анализ на алгоритми, БД — бази данни</text>
<text x="720.0" y="96.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">Kahn: опашка от върхове с входна степен 0</text>
<text x="720.0" y="126.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1. вземи УП  </text>
<text x="870.0" y="126.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">готови: ООП, ДС</text>
<text x="720.0" y="156.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2. вземи ООП </text>
<text x="870.0" y="156.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">готови: ДС, БД</text>
<text x="720.0" y="186.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3. вземи ДС  </text>
<text x="870.0" y="186.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">готови: СДП, БД</text>
<text x="720.0" y="216.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4. вземи СДП </text>
<text x="870.0" y="216.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">готови: ДАА, БД</text>
<text x="720.0" y="246.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5. вземи ДАА </text>
<text x="870.0" y="246.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">готови: БД</text>
<text x="720.0" y="276.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">6. вземи БД  </text>
<text x="870.0" y="276.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">готови: —</text>
