<text x="260.0" y="144.7" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ООП</text>
<circle cx="100.0" cy="270.0" r="26" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
