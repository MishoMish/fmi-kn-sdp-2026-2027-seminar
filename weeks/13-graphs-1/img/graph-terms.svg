<text x="70.0" y="336.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">три свързани компоненти</text>
<text x="270.0" y="252.0" font-size="13" fill="#eb6834" text-anchor="start" font-weight="600">deg(3) = 3</text>
<text x="40.0" y="380.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">път 0 → 1 → 3 → 4 (оранжево): дължина 3</text>
<text x="40.0" y="402.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">цикъл 0 – 1 – 3 – 2 – 0; 7 е изолиран връх</text>
<text x="40.0" y="424.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">n = |V| = 8, m = |E| = 6; ненасочен: ребро {u, v} = {v, u}</text>
