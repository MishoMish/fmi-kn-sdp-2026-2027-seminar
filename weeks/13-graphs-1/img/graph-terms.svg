<circle cx="780.0" cy="280.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="780.0" y="285.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<circle cx="900.0" cy="280.0" r="20" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="900.0" y="285.4" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">4</text>
<text x="780.0" y="96.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="700">насочен граф</text>
<text x="780.0" y="336.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">дъга (u, v) ≠ (v, u)</text>
<text x="780.0" y="358.0" font-size="14" fill="#eb6834" text-anchor="start" font-weight="400">вх. степен на 2: 2, изх. степен: 0</text>
<text x="780.0" y="380.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">насочен цикъл? — няма</text>
