<line x1="700.0" y1="130.0" x2="722.0" y2="130.0" stroke="#e34948" stroke-width="3" stroke-linecap="round"/>
<text x="730.0" y="135.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">матрица на съседство</text>
<line x1="700.0" y1="154.0" x2="722.0" y2="154.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
<text x="730.0" y="159.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">списъци (вашият Graph)</text>
<line x1="700.0" y1="178.0" x2="722.0" y2="178.0" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/>
<text x="730.0" y="183.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">CSR (един масив)</text>
<text x="700.0" y="230.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">n = 16 000: матрица 155 ms / 256 MB,</text>
<text x="700.0" y="252.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">списъци 0.62 ms / 1.1 MB</text>
<text x="700.0" y="288.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">n = 4·10^6: списъци 293 ms, CSR 187 ms</text>
<text x="700.0" y="310.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">памет 270 MB срещу 144 MB</text>
<text x="700.0" y="346.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Матрицата: Θ(n²) — наклон 2.</text>
<text x="700.0" y="368.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Списъци и CSR: Θ(n + m) — наклон 1;</text>
<text x="700.0" y="390.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">CSR — по-малко памет, по-малко промахи.</text>
</svg>
