<text x="100.0" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">10^3</text>
<line x1="255.5" y1="420.0" x2="255.5" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="255.5" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">10^4</text>
<line x1="410.9" y1="420.0" x2="410.9" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="410.9" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">10^5</text>
<line x1="566.4" y1="420.0" x2="566.4" y2="426.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="566.4" y="444.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400">10^6</text>
<line x1="100.0" y1="420.0" x2="660.0" y2="420.0" stroke="#8a8984" stroke-width="1" stroke-linecap="round"/>
<text x="380.0" y="472.0" font-size="15" fill="#52514e" text-anchor="middle" font-weight="400">n (лог. ос)</text>
<text transform="translate(42,260.0) rotate(-90)" font-size="15" fill="#52514e" text-anchor="middle">ms (лог. ос)</text>
