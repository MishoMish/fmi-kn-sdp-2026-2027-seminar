<line x1="100.0" y1="153.3" x2="660.0" y2="153.3" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="90.0" y="158.3" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">100</text>
