<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Защо преместването трябва да пренасочи двата крайни възела</title>
<rect width="1100" height="400" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Преместване: фиктивният възел НЕ се мести с възлите</text>
<text x="40.0" y="72.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">sentinel_ е поле на обекта; първият и последният възел сочат адреса на стария sentinel_</text>
<rect x="60.0" y="120.0" width="120.0" height="46.0" rx="6" fill="#f6f5f2" stroke="#8a8984" stroke-width="1.6" stroke-dasharray="5 4"/>
