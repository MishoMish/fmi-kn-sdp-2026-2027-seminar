<line x1="74.0" y1="370.0" x2="104.0" y2="370.0" stroke="#e34948" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="112.0" y="375.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">преди: сочат стария sentinel → висящи указатели след преместването</text>
<line x1="600.0" y1="370.0" x2="630.0" y2="370.0" stroke="#1baf7a" stroke-width="2.4" stroke-linecap="round"/>
<text x="638.0" y="375.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">stealNodes: пренасочваме ги към новия</text>
</svg>
