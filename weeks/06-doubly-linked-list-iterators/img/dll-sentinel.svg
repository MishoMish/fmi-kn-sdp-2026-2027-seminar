<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Двусвързан цикличен списък с фиктивен възел</title>
<rect width="1100" height="360" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Двусвързан списък с фиктивен възел (като std::list)</text>
<rect x="60.0" y="150.0" width="120.0" height="46.0" rx="6" fill="#f6f5f2" stroke="#8a8984" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="88.0" y1="150.0" x2="88.0" y2="196.0" stroke="#8a8984" stroke-width="1.1" stroke-linecap="round"/>
<line x1="152.0" y1="150.0" x2="152.0" y2="196.0" stroke="#8a8984" stroke-width="1.1" stroke-linecap="round"/>
<text x="120.0" y="179.0" font-size="16" fill="#8a8984" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">•</text>
<text x="120.0" y="216.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">sentinel_ = end()</text>
<rect x="290.0" y="150.0" width="120.0" height="46.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="318.0" y1="150.0" x2="318.0" y2="196.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<line x1="382.0" y1="150.0" x2="382.0" y2="196.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<text x="350.0" y="179.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">a</text>
<text x="350.0" y="216.0" font-size="13" fill="#8a8984" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">begin()</text>
<rect x="520.0" y="150.0" width="120.0" height="46.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="548.0" y1="150.0" x2="548.0" y2="196.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<line x1="612.0" y1="150.0" x2="612.0" y2="196.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<text x="580.0" y="179.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">b</text>
<rect x="750.0" y="150.0" width="120.0" height="46.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="778.0" y1="150.0" x2="778.0" y2="196.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<line x1="842.0" y1="150.0" x2="842.0" y2="196.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<text x="810.0" y="179.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">c</text>
<line x1="166.0" y1="164.7" x2="288.0" y2="164.7" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="304.0" y1="181.3" x2="182.0" y2="181.3" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="396.0" y1="164.7" x2="518.0" y2="164.7" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="534.0" y1="181.3" x2="412.0" y2="181.3" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="626.0" y1="164.7" x2="748.0" y2="164.7" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="764.0" y1="181.3" x2="642.0" y2="181.3" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 856,164.72 C 960,120 960,96 520,96 C 160,96 120,110 120,148" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 74,187.28 C 74,260 300,262 520,262 C 820,262 830,250 830,198" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="530.0" y="88.0" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">c.next = sentinel</text>
<text x="530.0" y="282.0" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">sentinel.prev = c  (затова --end() е последният)</text>
<text x="40.0" y="330.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Всеки истински възел винаги има истински prev и next → insert и erase нямат специални случаи.</text>
</svg>
