<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Категории итератори</title>
<rect width="1100" height="470" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="700">Категории итератори: всяка може всичко от предишната и още</text>
<rect x="40.0" y="80.0" width="1020.0" height="340.0" rx="12" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="58.0" y="108.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">input / forward</text>
<text x="270.0" y="108.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">*it, ++it, ==</text>
<text x="1042.0" y="108.0" font-size="14" fill="#52514e" text-anchor="end" font-weight="400">forward_list, unordered_map, istream</text>
<rect x="70.0" y="156.0" width="960.0" height="264.0" rx="12" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.6"/>
<text x="88.0" y="184.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">bidirectional</text>
<text x="300.0" y="184.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">+ --it</text>
<text x="1012.0" y="184.0" font-size="14" fill="#52514e" text-anchor="end" font-weight="400">List (днес), std::list, set, map</text>
<rect x="100.0" y="232.0" width="900.0" height="188.0" rx="12" fill="#fde8df" stroke="#eb6834" stroke-width="1.6"/>
<text x="118.0" y="260.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">random access</text>
<text x="330.0" y="260.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">+ it + n, it[n], it2 − it1, &lt;</text>
<text x="982.0" y="260.0" font-size="14" fill="#52514e" text-anchor="end" font-weight="400">deque</text>
<rect x="130.0" y="308.0" width="840.0" height="112.0" rx="12" fill="#fbe7ef" stroke="#e87ba4" stroke-width="1.6"/>
<text x="148.0" y="336.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="700">contiguous</text>
<text x="360.0" y="336.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">+ елементите са един до друг в паметта</text>
<text x="952.0" y="336.0" font-size="14" fill="#52514e" text-anchor="end" font-weight="400">vector, array, C масив, string</text>
<text x="40.0" y="456.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Алгоритъм обявява какво му трябва: std::find — forward, std::reverse — bidirectional, std::sort — random access.</text>
</svg>
