<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" font-family="'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
<title>Полуотвореният интервал [begin, end)</title>
<rect width="1000" height="260" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="46.0" font-size="22" fill="#0b0b0b" text-anchor="start" font-weight="700">[begin(), end()): end() е „след последния“</text>
<rect x="80.0" y="110.0" width="120.0" height="46.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="108.0" y1="110.0" x2="108.0" y2="156.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<line x1="172.0" y1="110.0" x2="172.0" y2="156.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<text x="140.0" y="139.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">a</text>
<rect x="260.0" y="110.0" width="120.0" height="46.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="288.0" y1="110.0" x2="288.0" y2="156.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<line x1="352.0" y1="110.0" x2="352.0" y2="156.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<text x="320.0" y="139.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">b</text>
<rect x="440.0" y="110.0" width="120.0" height="46.0" rx="6" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.6"/>
<line x1="468.0" y1="110.0" x2="468.0" y2="156.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<line x1="532.0" y1="110.0" x2="532.0" y2="156.0" stroke="#2a78d6" stroke-width="1.1" stroke-linecap="round"/>
<text x="500.0" y="139.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">c</text>
<rect x="620.0" y="110.0" width="120.0" height="46.0" rx="6" fill="#f6f5f2" stroke="#8a8984" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="648.0" y1="110.0" x2="648.0" y2="156.0" stroke="#8a8984" stroke-width="1.1" stroke-linecap="round"/>
<line x1="712.0" y1="110.0" x2="712.0" y2="156.0" stroke="#8a8984" stroke-width="1.1" stroke-linecap="round"/>
<text x="680.0" y="139.0" font-size="16" fill="#8a8984" text-anchor="middle" font-weight="600" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">•</text>
<line x1="140.0" y1="92.0" x2="140.0" y2="106.0" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="140.0" y="86.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">begin()</text>
<line x1="680.0" y1="92.0" x2="680.0" y2="106.0" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="680.0" y="86.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">end()</text>
<line x1="500.0" y1="92.0" x2="500.0" y2="106.0" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="500.0" y="86.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::prev(end())</text>
<text x="40.0" y="210.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Празен интервал: begin() == end(). Брой елементи: distance(begin, end). Цикълът е винаги</text>
<text x="40.0" y="234.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">for (it = begin; it != end; ++it) — никога &lt;= и никога *end().</text>
</svg>
