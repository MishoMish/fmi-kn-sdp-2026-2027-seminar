<text x="150.0" y="342.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">std::deque</text>
<line x1="242.0" y1="336.0" x2="446.0" y2="230.0" stroke="#2a78d6" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="450.0" y="190.0" width="200.0" height="80.0" rx="10" fill="#fde8df" stroke="#eb6834" stroke-width="2"/>
