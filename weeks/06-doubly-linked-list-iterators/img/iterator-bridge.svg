<rect x="860.0" y="262.0" width="180.0" height="40.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="950.0" y="288.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">sort*</text>
<line x1="652.0" y1="230.0" x2="856.0" y2="282.0" stroke="#1baf7a" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="860.0" y="316.0" width="180.0" height="40.0" rx="6" fill="#dcf3ea" stroke="#1baf7a" stroke-width="1.5"/>
<text x="950.0" y="342.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">accumulate</text>
<line x1="652.0" y1="230.0" x2="856.0" y2="336.0" stroke="#1baf7a" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="40.0" y="384.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Контейнерът казва КАК се върви; алгоритъмът — КАКВО се прави. * sort изисква произволен достъп.</text>
