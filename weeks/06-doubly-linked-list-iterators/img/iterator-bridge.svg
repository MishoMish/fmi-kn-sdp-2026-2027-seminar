<text x="150.0" y="234.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">C масив</text>
<line x1="242.0" y1="228.0" x2="446.0" y2="230.0" stroke="#2a78d6" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
