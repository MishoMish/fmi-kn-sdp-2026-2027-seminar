<text x="40.0" y="484.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400">Под 64 B няколко поредни четения падат в една кеш линия; от 64 B нагоре всяко четене е в нова линия (~10× по-бавно).</text>
