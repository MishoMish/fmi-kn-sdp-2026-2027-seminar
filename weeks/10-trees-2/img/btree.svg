<line x1="944.0" y1="230.0" x2="944.0" y2="270.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<line x1="594.0" y1="140.0" x2="900.0" y2="230.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round"/>
<text x="40.0" y="320.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Възел с k ключа има k + 1 деца; всички листа са на една дълбочина.</text>
<text x="40.0" y="344.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Диск (блок 4–16 KB): стотици ключове във възел → при ~500 ключа 4 нива стигат за над 60 милиарда ключа.</text>
<text x="40.0" y="368.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Бази данни (B+ дървета в PostgreSQL, MySQL/InnoDB, SQLite), файлови системи (NTFS, Btrfs, APFS).</text>
</svg>
