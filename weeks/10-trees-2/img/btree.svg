<line x1="550.0" y1="100.0" x2="550.0" y2="140.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<rect x="134.0" y="230.0" width="132.0" height="40.0" rx="6" fill="#f6f5f2" stroke="#52514e" stroke-width="1.5"/>
<text x="156.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">5</text>
<text x="200.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">10</text>
<line x1="178.0" y1="230.0" x2="178.0" y2="270.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="244.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">20</text>
<line x1="222.0" y1="230.0" x2="222.0" y2="270.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<line x1="506.0" y1="140.0" x2="200.0" y2="230.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round"/>
<rect x="484.0" y="230.0" width="132.0" height="40.0" rx="6" fill="#f6f5f2" stroke="#52514e" stroke-width="1.5"/>
<text x="506.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">35</text>
<text x="550.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">40</text>
<line x1="528.0" y1="230.0" x2="528.0" y2="270.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<text x="594.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">50</text>
<line x1="572.0" y1="230.0" x2="572.0" y2="270.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
<line x1="550.0" y1="140.0" x2="550.0" y2="230.0" stroke="#52514e" stroke-width="1.4" stroke-linecap="round"/>
<rect x="812.0" y="230.0" width="176.0" height="40.0" rx="6" fill="#f6f5f2" stroke="#52514e" stroke-width="1.5"/>
<text x="834.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">70</text>
<text x="878.0" y="256.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">80</text>
<line x1="856.0" y1="230.0" x2="856.0" y2="270.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/>
