<text x="700.0" y="103.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">сортираме само по числото</text>
<text x="700.0" y="173.0" font-size="14" fill="#1baf7a" text-anchor="start" font-weight="400">b преди e, a преди c — като във входа</text>
<text x="700.0" y="243.0" font-size="14" fill="#e34948" text-anchor="start" font-weight="400">e преди b — също сортирано, но друго</text>
<text x="40.0" y="310.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Защо е важно: сортирайте по име, после стабилно по град → в един град имената остават по азбучен ред.</text>
