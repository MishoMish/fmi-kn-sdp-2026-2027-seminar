<text x="40.0" y="420.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">оранжевите числа — редът на siftDown; сивите (листата) — вече са пирамиди</text>
<text x="700.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">ниво</text>
<text x="810.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">възли</text>
<text x="910.0" y="120.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">≤ слизания</text>
<text x="700.0" y="150.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">листа</text>
<text x="810.0" y="150.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">≈ n/2</text>
<text x="910.0" y="150.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">0</text>
<text x="700.0" y="180.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">над тях</text>
<text x="810.0" y="180.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">≈ n/4</text>
<text x="910.0" y="180.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">1</text>
<text x="700.0" y="210.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400"></text>
<text x="810.0" y="210.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">≈ n/8</text>
<text x="910.0" y="210.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">2</text>
<text x="700.0" y="240.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400"></text>
<text x="810.0" y="240.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">≈ n/16</text>
<text x="910.0" y="240.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">3</text>
<text x="700.0" y="270.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">…</text>
<text x="810.0" y="270.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace"></text>
<text x="910.0" y="270.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400" font-family="'IBM Plex Mono',Consolas,Menlo,monospace"></text>
<text x="700.0" y="320.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">общо ≤ n · (1/4 + 2/8 + 3/16 + …) = n</text>
<text x="700.0" y="348.0" font-size="15" fill="#1baf7a" text-anchor="start" font-weight="700">→ ≤ 2n сравнения: Θ(n)</text>
<text x="700.0" y="380.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">n поредни push: Θ(n log n)</text>
<text x="700.0" y="402.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">(повечето възли са долу, а там</text>
<text x="700.0" y="422.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">siftDown е евтин, siftUp — скъп)</text>
